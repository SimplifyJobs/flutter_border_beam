name: Feature request
description: Propose a new effect, option, palette, or API.
title: "[feat]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Every effect is drawn by one fragment shader in a single draw call,
        with no offscreen layers or blurs. Proposals that fit that model — new
        light along the border, new motion, new palettes, new options — are
        the easiest sell. Describe the look you want; how to render it is a
        conversation for the issue.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to build, and where does the package get in the
        way? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: >-
        A sketch of the call site as you would want to write it. Rough is
        fine — the shape is what matters.
      render: dart
      placeholder: |
        BorderBeam(
          effect: const BeamEffect.rotate(length: 0.4),
          child: ...,
        )
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        What can you do today instead, and why is it not enough? Include any
        workaround you are currently shipping.
    validations:
      required: true

  - type: dropdown
    id: rendering-defaults
    attributes:
      label: Does this change rendering defaults?
      description: >-
        Would an existing `BorderBeam` with no new arguments look or animate
        differently? That makes it a breaking visual change, which needs a
        much stronger case and regenerated goldens.
      options:
        - "No — purely additive, defaults unchanged"
        - "Yes — existing beams would render differently"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >-
        References, screenshots, a video, or a mockup of the effect.
    validations:
      required: false
