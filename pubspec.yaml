name: prismatic
description: >-
  Shader effects for Flutter: BorderBeam, light around a widget's border,
  and DistortionWave, a wave carrying one screen into another. Built for
  Impeller; also runs on Skia and web.
version: 0.3.0
repository: https://github.com/SimplifyJobs/prismatic
issue_tracker: https://github.com/SimplifyJobs/prismatic/issues
homepage: https://github.com/SimplifyJobs/prismatic
documentation: https://github.com/SimplifyJobs/prismatic/tree/main/doc
topics:
  - animation
  - shader
  - transition
  - glow
  - effect
screenshots:
  - path: screenshots/rotate.png
    description: Rotate effect — a beam travels around the full border of a card.
  - path: screenshots/line.png
    description: Line effect — a streak rides the bottom edge of an input.
  - path: screenshots/pulse.png
    description: Pulse effect — colour breathes in from the border of a card.
  - path: screenshots/squircle.png
    description: Superellipse corners in the ocean palette — an Apple-style squircle outline.
  - path: screenshots/distortion_wave.png
    description: DistortionWave — the front crossing a screen from a button, bending and blurring what it passes.
  - path: screenshots/distortion_wave_center.png
    description: DistortionWave, center type — a ring spreading from an avatar inside a sheet.

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned by flutter_test; listed so tests can switch leak tracking on.
  leak_tracker_flutter_testing: any

flutter:
  shaders:
    - shaders/beam.frag
    - shaders/wave.frag
    - shaders/wave_glow.frag
