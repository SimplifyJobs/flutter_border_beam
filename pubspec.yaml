name: flutter_border_beam
description: >-
  Animated light around any widget's border: four effects drawn by a single-pass
  fragment shader at the display rate, 19 palettes, squircle corners, and theming.
version: 0.2.0
repository: https://github.com/SimplifyJobs/flutter_border_beam
issue_tracker: https://github.com/SimplifyJobs/flutter_border_beam/issues
homepage: https://github.com/SimplifyJobs/flutter_border_beam
documentation: https://github.com/SimplifyJobs/flutter_border_beam/tree/main/doc
topics:
  - animation
  - border
  - glow
  - effect
  - ui
screenshots:
  - path: screenshots/rotate.png
    description: Rotate effect — a beam travels around the full border of a card.
  - path: screenshots/pulse_outside.png
    description: Halo effect — light breathes outward around the widget.
  - path: screenshots/line.png
    description: Line effect — a streak rides the bottom edge of an input.
  - path: screenshots/squircle.png
    description: Superellipse corners in the ocean palette — an Apple-style squircle outline.

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/beam.frag
