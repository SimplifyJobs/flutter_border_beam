name: flutter_border_beam_example
description: >-
  Gallery and interactive playground for the flutter_border_beam package,
  plus the recording reels used to capture its demo videos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_border_beam:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
