name: prismatic_example
description: >-
  One-screen showcase of the prismatic effects and palettes, plus
  the recording reels used to capture its demo videos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  prismatic:
    path: ../
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
